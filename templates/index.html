<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOCL Threat Detector</title>
    <!-- We are using Tailwind CSS (via CDN) to make the page look good instantly -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header Section -->
        <header class="flex justify-between items-center border-b border-gray-700 pb-4 mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Industrial Threat Detector</h1>
            <span class="bg-green-500 text-white px-3 py-1 rounded-full text-sm font-semibold">System Online</span>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Video Feed Area (Takes up 2/3 of the space) -->
            <div class="md:col-span-2 bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">Live Camera Feed</h2>
                <!-- This black box is a placeholder for Phase 3 where the real video will go -->
                <div class="w-full bg-black aspect-video rounded flex items-center justify-center border border-gray-600">
                    <p class="text-gray-500 text-lg">Camera Feed Offline (Awaiting Phase 3)</p>
                </div>
            </div>

            <!-- Controls Panel Area (Takes up 1/3 of the space) -->
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-lg flex flex-col">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">System Controls</h2>
                
                <p class="text-sm text-gray-400 mb-6">
                    Use this panel to test the server, database, and SMS pipeline before the AI is ready.
                </p>

                <!-- Our Simulation Button -->
                <button id="simulateBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded w-full transition duration-200">
                    🔥 Simulate Fire Event
                </button>

                <!-- A spot to show messages from the server -->
                <div id="statusMessage" class="mt-6 text-sm text-center hidden p-3 rounded"></div>
            </div>
        </div>
    </div>

    <!-- Javascript to make the button actually communicate with app.py -->
    <script>
        const simulateBtn = document.getElementById('simulateBtn');
        const statusMessage = document.getElementById('statusMessage');

        simulateBtn.addEventListener('click', function() {
            // Change button text while processing
            simulateBtn.innerText = "Processing...";
            simulateBtn.disabled = true;

            // Send a POST request to our Flask server's Route 2
            fetch('/simulate_threat', {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                // Show the success message on the screen
                statusMessage.innerText = data.message;
                statusMessage.classList.remove('hidden', 'bg-red-900');
                statusMessage.classList.add('bg-green-800', 'text-green-100');
                
                // Reset the button
                simulateBtn.innerText = "🔥 Simulate Fire Event";
                simulateBtn.disabled = false;
            })
            .catch((error) => {
                console.error('Error:', error);
                statusMessage.innerText = "Failed to reach server.";
                statusMessage.classList.remove('hidden');
                simulateBtn.innerText = "🔥 Simulate Fire Event";
                simulateBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
